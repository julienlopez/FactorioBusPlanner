[workspace]
members = [
    "cli",
    "common",
    "ui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
serde_json = "1"

[workspace.dependencies.clap]
version = "4"
features = ["derive"]

[workspace.dependencies.fbp-common]
path = "common"

[workspace.dependencies.serde]
version = "1"
features = ["derive"]
